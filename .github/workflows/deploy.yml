name: Build and Deploy to Firebase

on:
  push:
    branches: [ main ]
  workflow_dispatch:
  # Toutes les 15 min : reconstruit le site (pages SEO + sitemap) si les articles
  # Firestore ont changé (publication, modification, suppression dans l'admin).
  schedule:
    - cron: '*/15 * * * *'

# Jamais deux déploiements en parallèle
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  check_articles:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    outputs:
      changed: ${{ steps.check.outputs.changed }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Compare Firestore articles with live site
        id: check
        run: node scripts/check-articles.js

      # GitHub désactive les tâches planifiées d'un dépôt public sans activité
      # depuis 60 jours : la réactiver remet ce compteur à zéro.
      - name: Keep scheduled workflow enabled
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/deploy.yml/enable"

  build_and_deploy:
    needs: check_articles
    if: ${{ !cancelled() && (github.event_name != 'schedule' || needs.check_articles.outputs.changed == 'true') }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci

      - name: Build project (Vite + SEO pages)
        run: npm run build

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Deploy to Firebase Hosting
        id: deploy
        run: |
          if npx firebase-tools deploy --only hosting --project cjr-soub --message "Deploy run ${{ github.run_number }}" 2>&1 | tee deploy.log; then
            echo "deploy_status=success" >> "$GITHUB_OUTPUT"
          else
            if grep -q "is the current active version" deploy.log; then
              echo "deploy_status=skipped" >> "$GITHUB_OUTPUT"
              echo "::notice::Deploy skipped — content identical to current live version"
            else
              echo "deploy_status=failed" >> "$GITHUB_OUTPUT"
              cat deploy.log
              exit 1
            fi
          fi